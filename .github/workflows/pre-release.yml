name: Pre-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pre-release:
    name: Build and Upload Pre-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: confcli-bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: confcli-bin/go.mod
          cache-dependency-path: confcli-bin/go.sum

      - name: Generate version string
        id: version
        run: |
          # Get the latest tag for base version, or use 0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE_VERSION=${LATEST_TAG#v}
          COMMIT_SHORT=$(git rev-parse --short=8 HEAD)
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          echo "VERSION=${BASE_VERSION}-dev.${COMMIT_SHORT}.${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          LDFLAGS="-s -w -X confcli/cmd/confcli/commands.Version=${VERSION} -X confcli/cmd/confcli/commands.Commit=${COMMIT} -X confcli/cmd/confcli/commands.Date=${DATE}"

          mkdir -p dist/windows-amd64 dist/linux-amd64 dist/darwin-arm64

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/windows-amd64/confcli.exe ./cmd/confcli

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/linux-amd64/confcli ./cmd/confcli

          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/darwin-arm64/confcli ./cmd/confcli

      - name: Create release archives
        working-directory: confcli-bin/dist
        run: |
          tar czf confcli-linux-amd64.tar.gz -C linux-amd64 confcli
          tar czf confcli-darwin-arm64.tar.gz -C darwin-arm64 confcli
          zip -j confcli-windows-amd64.zip windows-amd64/confcli.exe
          sha256sum confcli-linux-amd64.tar.gz confcli-darwin-arm64.tar.gz confcli-windows-amd64.zip > checksums.txt

      - name: Delete existing pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing 'dev' release if it exists
          gh release delete dev --yes 2>/dev/null || true
          # Clean up the git tag if it exists
          git push --delete origin dev 2>/dev/null || true

      - name: Create dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build"
          prerelease: true
          generate_release_notes: true
          files: |
            confcli-bin/dist/confcli-linux-amd64.tar.gz
            confcli-bin/dist/confcli-darwin-arm64.tar.gz
            confcli-bin/dist/confcli-windows-amd64.zip
            confcli-bin/dist/checksums.txt
          body: |
            ## Development Build
            - **Commit:** ${{ github.sha }}
            - **Version:** ${{ steps.version.outputs.VERSION }}
            - **Built:** ${{ github.event.head_commit.timestamp }}

            > This is an automated pre-release build from the `main` branch. It may contain unreleased features and bug fixes.
